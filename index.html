<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sai Electronics &amp; Appliances Pvt. Ltd. — Accounting ERP</title>
    <meta
      name="description"
      content="Browser-based Accounting ERP: double-entry posting, GST, vouchers, financial statements and internal controls."
    />
    <meta name="theme-color" content="#1a39b0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved theme before the app paints, so there is no flash of the
      // wrong colour scheme. Mirrors src/store/theme.ts.
      (function () {
        try {
          var mode = localStorage.getItem('sai-erp-theme') || 'system'
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* localStorage unavailable — fall back to the light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
